<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스마트팜 관제</title>
<style>body{font:16px system-ui;background:#edf5f0;color:#153c30;max-width:1000px;margin:auto;padding:24px}section,article{background:white;padding:22px;border-radius:18px;margin:16px 0}input,button{font:inherit;padding:12px;margin:5px;border-radius:8px;border:1px solid #abc}button{background:#176b4b;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}small{color:#596}pre{white-space:pre-wrap}table{width:100%;text-align:left} .off{color:#b33}</style>
<h1>🌱 스마트팜 관제</h1><p>ESP32 MQTT 게이트웨이 · RS-485 UNO 2개</p>
<section id="login"><h2>학생 로그인</h2><input id="user" autocomplete="username" placeholder="아이디"><input id="pass" type="password" autocomplete="current-password" placeholder="비밀번호"><button onclick="login()">접속</button></section>
<section id="dashboard" hidden><button onclick="logout()">로그아웃</button><p id="connection"></p><div id="nodes" class="grid"></div><button onclick="history()">최근 저장 기록</button><pre id="history"></pre><p>펌프는 최대 5초 후 자동 정지합니다. 원시 ADC 값은 교정 전에는 수분 %가 아닙니다.</p></section><p id="message" role="status"></p>
<script>
let csrf='',states={};
async function api(url,body){const r=await fetch('/api/'+url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d;}
function say(t){document.getElementById('message').textContent=t;}
async function login(){try{let d=await api('login',{username:document.getElementById('user').value,password:document.getElementById('pass').value});csrf=d.csrf;document.getElementById('login').hidden=true;document.getElementById('dashboard').hidden=false;document.getElementById('pass').value='';say('접속했습니다');refresh();}catch(e){say(e.message)}}
async function logout(){await api('logout',{});location.reload()}
async function control(n,p,l){try{await api('command',{node:n,pump:p,led:l});say('전송했습니다. 노드의 확인 응답을 기다립니다.')}catch(e){say(e.message)}}
async function refresh(){if(!csrf)return;try{let d=await api('state');states=d.nodes;document.getElementById('connection').textContent='MQTT '+(d.mqtt?'연결됨':'연결 끊김');document.getElementById('nodes').innerHTML=[1,2].map(n=>{let s=d.nodes[n],j=d.commands[n];return `<article><h2>재배구역 ${n}</h2><p>${s&&s.online?'온라인':'오프라인'}</p><p>토양 ADC: ${s?s.raw:'—'}</p><p>펌프: ${s?s.pump?'동작':'정지':'—'} · LED: ${s?s.led:'—'}</p><button onclick="control(${n},1,${s?s.led:0})" ${!s||!s.online?'disabled':''}>5초 급수</button><button onclick="control(${n},0,${s?s.led:0})">정지</button><button onclick="control(${n},0,${s?(s.led^1):1})">LED 1 전환</button><button onclick="control(${n},0,${s?(s.led^2):2})">LED 2 전환</button><small>명령: ${j?j.status:'없음'}</small></article>`}).join('')}catch(e){say(e.message)}}
async function history(){try{let d=await api('history');document.getElementById('history').textContent=d.rows.map(x=>`${x.created_at} 구역${x.node_id} ADC=${x.raw} 펌프=${x.pump}`).join('\n')}catch(e){say(e.message)}}
setInterval(refresh,2000);
</script></html>
